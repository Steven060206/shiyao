<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>拾要</title>
  <link rel="icon" href="assets/shiyao.ico">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="assets/shiyao.png" width="32" height="32" alt="" aria-hidden="true">拾要</div>
      <p class="brand-caption">学校群消息整理</p>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sidebar-foot"><b id="connection-status">等待连接</b><span id="receiving-status">正在读取本地事项</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">拾要 <span aria-hidden="true"> / </span><strong id="breadcrumb">任务</strong></div>
        <div class="top-actions"><span class="connection-badge" id="history-status">等待同步</span><button class="button primary small" data-action="sync-now">自动同步</button><button class="button small" data-action="refresh">刷新</button></div>
      </header>
      <div class="workarea">
        <section class="list-pane" id="list-pane" aria-label="事项列表">
          <div class="page-head"><div><h1 id="page-title">任务</h1><p class="subline" id="page-subline">正在读取本地事项</p></div><div class="page-head-actions"><div class="date-stamp" id="date-stamp"></div><button class="button primary small" data-action="new-task" disabled>手动新增</button></div></div>
          <p class="error" id="host-error" role="alert" hidden></p>
          <div class="filters" id="filters">
            <input id="search" type="search" aria-label="搜索事项" placeholder="搜索标题、课程或来源群">
            <select id="course-filter" aria-label="按课程筛选"><option value="">全部课程</option></select>
            <select id="state-filter" aria-label="按状态筛选"><option value="active">待办</option></select>
          </div>
          <div class="list-summary" id="list-summary"></div>
          <section id="batch-review" class="batch-review" aria-label="批量审核" hidden>
            <div class="batch-actions"><label class="batch-check"><input type="checkbox" id="batch-select-all">全选当前列表</label><span id="batch-count">已选 0 项</span><button class="button small" data-action="batch-ignore" disabled>批量忽略</button><button class="button primary small" data-action="batch-accept" disabled>批量加入任务</button></div>
            <div class="batch-options"><label>统一日期（可选）<input type="date" id="batch-date" aria-label="批量任务统一日期"></label><label class="batch-check"><input type="checkbox" id="batch-use-suggestions">使用各项建议日期</label></div>
            <p class="subline">加入前请核对日期；没有日期或需要单独审核的条目会保留。忽略后可在“回收站”中撤销。</p>
            <p id="batch-result" class="subline" role="status" hidden></p>
          </section>
          <div class="rows" id="rows"></div>
          <div id="settings-panel" hidden></div>
        </section>
        <aside class="detail-pane" id="detail-pane" aria-label="事项详情">
          <div class="detail-scroll"><div class="empty"><h2>正在读取</h2><p>等待本地应用提供事项。</p></div></div>
          <div class="confirmation-bar" hidden></div>
        </aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
